name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new OSV advisories fail the build without any change on our side.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # тот же тестовый ES, что в docker-compose.yml (профиль test)
      es-test:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5@sha256:38604132e9d6cf4cd0acc090b3de645361dc142384e5341338aecb863741c630
        env:
          cluster.name: index-test
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9233:9200
        options: >-
          --health-cmd "curl -sf localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # betterleaks scans the whole history
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
      - run: mise run check
