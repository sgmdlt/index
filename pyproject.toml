[project]
name = "es"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "lxml>=6.0.2",
    "elasticsearch>=8.0.0",
    "python-dateutil>=2.9.0",
    "psycopg2-binary>=2.9.0",
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "selectolax>=0.4.8",
    "warcio>=1.8.1",
    "docx2txt>=0.9",
    "striprtf>=0.0.32",
    "pymupdf>=1.28.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
]

[tool.ruff.lint]
# Same rule set as courts, so both repos read the same way.
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, the formatter owns line length
    "B008",  # function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]
