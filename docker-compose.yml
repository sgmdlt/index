services:
  kibana:
    image: kibana:8.15.3
    container_name: kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_HOST: 0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  elasticsearch:
    image: elasticsearch:8.15.3
    container_name: es-local
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
  # Тестовый ES для `mise run check`: версия как у прода, свой порт (9200 на
  # хосте занят продовым ES), имя кластера проверяет фикстура до любой записи.
  es-test:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.5@sha256:38604132e9d6cf4cd0acc090b3de645361dc142384e5341338aecb863741c630
    container_name: index-es-test
    profiles: [test]
    environment:
      - cluster.name=index-test
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9233:9200"
    tmpfs:
      - /usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health?wait_for_status=yellow"]
      interval: 5s
      retries: 30
volumes:
  esdata:
