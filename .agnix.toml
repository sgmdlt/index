# agnix lints the agent instruction files; `--strict` makes warnings fail.
# Each override is one path and the rules it cannot satisfy, with the reason.

# Claude Code worktrees are full checkouts of other branches, not this tree's files.
exclude = [".claude/worktrees/**"]

[[overrides]]
# The data lives on this one machine; CLAUDE.md names its real paths on purpose.
paths = ["CLAUDE.md"]
disabled_rules = ["XP-003"]

[[overrides]]
# "Keep that — don't rewrite assertions…" already gives the positive form first.
paths = ["CLAUDE.md"]
disabled_rules = ["PE-006"]

[[overrides]]
# Real finding, tracked as its own ticket: the file protects nothing (courts-4ecw).
paths = ["src/.claudeignore"]
disabled_rules = ["CC-SET-038"]
