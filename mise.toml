# One toolchain for developers, git hooks and CI: `mise install`, then `mise run check`.
# Python and its packages (ruff, ty, deptry, import-linter, pytest) stay on uv and are
# pinned by uv.lock; mise pins uv itself and the tools that are not Python packages.
# Linters get `git ls-files`, so untracked scratch files never fail the check.
min_version = "2026.11.3"

[env]
# __pycache__ is tracked in git: a check run must not dirty the tree.
PYTHONDONTWRITEBYTECODE = "1"

[tools]
uv = "0.13.7"
shellcheck = "0.11.0"
osv-scanner = "2.7.0"

[tasks.check]
description = "Run every check, the same set CI runs"
run = [
  "git ls-files -z '*.py' | xargs -0 uv run --locked ruff check --force-exclude",
  "git ls-files -z '*.py' | xargs -0 uv run --locked ruff format --check --force-exclude",
  "git ls-files -z '*.py' | xargs -0 uv run --locked ty check --error-on-warning",
  "uv run --locked deptry .",
  "uv run --locked lint-imports",
  "git ls-files -z '*.sh' | xargs -0 shellcheck",
  # Needs the network (api.osv.dev); CI also runs it weekly, since advisories land without a diff.
  "osv-scanner scan source -L uv.lock",
  "uv run --locked pytest tests -q -p no:cacheprovider",
]

[tasks.fix]
description = "Apply the automatic fixes"
run = [
  "git ls-files -z '*.py' | xargs -0 uv run --locked ruff check --fix --force-exclude",
  "git ls-files -z '*.py' | xargs -0 uv run --locked ruff format --force-exclude",
]
